# Run the full stack locally: docker compose up --build
# UI: http://localhost:8501   API: http://localhost:7860/health
services:
  api:
    build:
      context: .
      dockerfile: deploy/api/Dockerfile
    ports:
      - "7860:7860"

  app:
    build:
      context: .
      dockerfile: deploy/app/Dockerfile
    environment:
      API_URL: http://api:7860
    ports:
      - "8501:7860"
    depends_on:
      api:
        condition: service_healthy
